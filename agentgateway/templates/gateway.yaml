{{/*
  The platform GatewayClass + Gateway. The upstream agentgateway subchart installs the controller
  (it reconciles the GatewayClass whose controllerName matches its AGW_CONTROLLER_NAME); upstream
  ships NEITHER a GatewayClass nor a Gateway, so this renders both. Requires the Gateway API CRDs
  (gateway-api-crds blueprint) to be served — otherwise the Composition apply fails on an unknown
  kind, so install/order gateway-api-crds first.
*/}}
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ .Values.gatewayClassName }}
spec:
  controllerName: {{ .Values.controllerName }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Release.Namespace }}
  {{- with .Values.gateway.annotations }}
  {{/*
    Annotations on the Gateway. The reason this exists: cert-manager's gateway-shim
    watches Gateways carrying `cert-manager.io/cluster-issuer` (or `issuer`) and
    creates a Certificate for each listener that declares tls.certificateRefs. That
    is the idiomatic Gateway API + cert-manager path — without it a Certificate has
    to be applied out-of-band, which puts TLS outside the composition that owns the
    Gateway.
  */}}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  gatewayClassName: {{ .Values.gatewayClassName }}
  {{- with .Values.gateway.addresses }}
  {{/*
    Pin the Gateway to a pre-reserved address. Omitted entirely when unset, so the
    cloud assigns an ephemeral one — which is fine until the cluster is rebuilt, at
    which point the address changes and every published DNS record points at
    nothing. A reserved address survives teardown; this is how it gets reattached.
  */}}
  addresses:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  listeners:
    {{- toYaml .Values.gateway.listeners | nindent 4 }}
    {{- if .Values.llm.enabled }}
    {{/* T1: the LLM endpoint's own listener + certificate. A SEPARATE tls secret, so the
         gateway-shim issues it independently -- adding a hostname must never re-issue (and
         transiently break) the portal's certificate. */}}
    - name: https-llm
      protocol: HTTPS
      port: 443
      hostname: {{ required "llm.hostname is required when llm.enabled" .Values.llm.hostname | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ .Values.llm.tls.secretName }}
      allowedRoutes:
        namespaces:
          from: Same
    {{- end }}
