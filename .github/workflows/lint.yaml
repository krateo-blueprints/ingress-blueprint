name: lint

# Multi-blueprint lint. Mirrors release-oci.yaml's discovery: every directory holding a
# Chart.yaml is a blueprint, so lint/render each one (the repo ships several, unlike the
# single-`chart/` blueprint repos this was adapted from). Per chart: valid values.schema.json,
# vendored deps, `helm lint`, and a deterministic render (no randAlphaNum/uuidv4/now reaching a
# manifest — those never converge under the composition-dynamic-controller).

on:
  pull_request:
    branches: [blueprints, main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: read

jobs:
  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      # agentgateway wraps an OCI upstream chart (oci://ghcr.io/agentgateway/charts); log in
      # so `helm dependency build` can pull it (same as release-oci.yaml). Harmless for the
      # cert-manager/external-dns HTTP-repo dependencies.
      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Lint, validate schema, render (determinism) per blueprint
        run: |
          set -uo pipefail
          fail=0
          for c in */Chart.yaml; do
            d="$(dirname "$c")"
            echo "::group::${d}"
            sed -i "s/CHART_VERSION/0.0.0-ci/g" "${d}/Chart.yaml"

            if [ -f "${d}/values.schema.json" ]; then
              python3 -c "import json; json.load(open('${d}/values.schema.json'))" \
                && echo "values.schema.json: valid JSON" \
                || { echo "::error::${d}/values.schema.json is not valid JSON"; fail=1; }
            fi

            # Blueprints that wrap an upstream chart must vendor it before render.
            if grep -q '^dependencies:' "${d}/Chart.yaml"; then
              helm dependency build "${d}" >/dev/null 2>&1 || helm dependency update "${d}" >/dev/null 2>&1 || true
            fi

            helm lint "${d}" || fail=1

            # Some blueprints (external-dns) fail-render by DESIGN when a required input is
            # empty (its guards.yaml). Supply minimal CI-only inputs from .ci/<chart>.yaml when
            # present (outside the chart dir, so it's never packaged) so the render is exercised.
            vargs=""
            [ -f ".ci/${d}.yaml" ] && vargs="-f .ci/${d}.yaml"
            helm template rel "${d}" --namespace krateo-system ${vargs} > /tmp/r1.yaml 2>/tmp/err.txt \
              || { echo "::error::${d} failed to render"; tail -5 /tmp/err.txt; fail=1; echo "::endgroup::"; continue; }
            helm template rel "${d}" --namespace krateo-system ${vargs} > /tmp/r2.yaml 2>/dev/null || true
            if ! diff -q /tmp/r1.yaml /tmp/r2.yaml >/dev/null; then
              echo "::error::${d} render is NON-DETERMINISTIC"; diff /tmp/r1.yaml /tmp/r2.yaml | head -20; fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail
