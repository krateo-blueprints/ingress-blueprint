# Krateo-facing surface. Upstream defaults apply to everything not listed.

# The GatewayClass this edge uses. controllerName is written to BOTH the GatewayClass
# (spec.controllerName) and the agentgateway controller (AGW_CONTROLLER_NAME), so they must
# match — the controller only reconciles a GatewayClass whose controllerName equals its own.
# If you change these, change them in the `agentgateway:` passthrough below too (Helm cannot
# template subchart values, so the mapping is static — same caveat as external-dns).
gatewayClassName: agentgateway
controllerName: agentgateway.dev/agentgateway

# The platform Gateway the routes/DNS/certs attach to. `name` MUST match the installer's
# exposure.gatewayRef.name and cert-manager-issuers' acme.gatewayRef.name (default krateo-gateway).
gateway:
  name: krateo-gateway
  # Optional: pin the Gateway to a pre-reserved address. Unset means the cloud assigns
  # an ephemeral one, which it reassigns on every cluster rebuild — silently
  # invalidating every DNS record already published for the old address. A reserved
  # address survives teardown; this is how it gets reattached. Example:
  #   addresses:
  #     - type: IPAddress
  #       value: 34.154.210.215
  # Listeners passed through verbatim to the Gateway spec. The default is a single HTTP :80
  # listener, which serves ACME HTTP-01 challenges (cert-manager's gatewayHTTPRoute solver) and
  # HTTP-facing HTTPRoutes. For production add an HTTPS :443 listener with a cert-manager-issued
  # TLS cert (protocol: HTTPS, tls.certificateRefs), and restrict allowedRoutes as needed.
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All

# ---------------------------------------------------------------------------
# Passthrough to the upstream agentgateway controller chart. Helm places subchart values under
# a key named after the subchart and cannot compute them at render time — so the mapping is
# static here. Keep controllerName/gatewayClassName in sync with the top-level values above.
# ---------------------------------------------------------------------------
agentgateway:
  controllerName: agentgateway.dev/agentgateway
  gatewayClassName: agentgateway

# ---------------------------------------------------------------------------
# T1 — LLM brokering. The gateway fronts Vertex AI so the credential never leaves the
# parent; children (and any other client) speak the OpenAI wire format to
# https://<llm.hostname>/v1 with a per-client API key. Disabled by default; when enabled
# WITHOUT any key Secret it is fail-closed (every request 401s), and the two Secrets it
# references are ALWAYS operator-placed, never templated:
#   - llm.vertex.credentialSecret: ADC-compatible service-account JSON (gateway -> Vertex)
#   - one or more key Secrets matching llm.clientKeys.matchLabels, entries holding
#     {"keyHash": "sha256:<hex>", "metadata": {...}} (client -> gateway; per-trial, T2)
llm:
  enabled: false
  # Public hostname for the endpoint. Also appended to the Gateway as an HTTPS listener
  # with its OWN certificate secret (llm.tls.secretName) so cert-manager's gateway-shim
  # issues it independently of the portal cert.
  hostname: ""
  tls:
    secretName: llm-edge-tls
  vertex:
    projectId: ""
    region: "global"
    # Optional: pin every request to one model (cost control). Unset = client chooses.
    model: ""
    credentialSecret:
      name: vertex-sa-key
      key: credentials.json
  clientKeys:
    matchLabels:
      llm.krateo.io/client-keys: "true"

# ---------------------------------------------------------------------------
# T2 — per-tenant token credits. Meters the LLM route (requires llm.enabled) against an
# external rate-limit service that holds each tenant's balance. This ships the CONFIG; the
# balance service is a separate component (contract in agentgateway/docs/credits.md).
# Disabled by default. See the doc for the VERIFIED enforcement model (retrospective:
# blocks the NEXT request after the budget is crossed; single-request overshoot bounded by
# perRequestCap).
credits:
  enabled: false
  # Arbitrary domain string the rate-limit service uses to namespace counters.
  domain: krateo-trials
  # CEL that yields the per-tenant key the balance is decremented against. Default reads the
  # `tenant` metadata group the T1 client-key auth attaches to the request.
  tenantExpression: 'apiKey.tenant'
  # Optional CEL for the per-request cost. Empty = total tokens (unit Tokens). Set to a
  # per-model $/token price expression to meter in currency (the C5/S4 rating model).
  costExpression: ""
  # Hard ceiling on any ONE request (bounds the retrospective-overshoot). Tokens/minute
  # per proxy; empty = no per-request cap (overshoot then bounded only by the model output).
  perRequestCap: 8000
  # The external rate-limit service implementing the credit balance (Envoy RLS gRPC).
  service:
    backendRef:
      kind: Service
      name: credit-ratelimit
      namespace: krateo-system
      port: 8081

