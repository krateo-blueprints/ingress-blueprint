# Every setting lives under the `external-dns` key.
#
# This is not a stylistic choice. Helm requires a subchart's values to sit under a
# key named after that subchart, and a parent chart cannot compute them at render
# time — there is no template, no import-values (child->parent only) and no global:
# route that will carry a curated top-level field into the subchart. A blueprint
# that exposes its own names on top of an upstream chart therefore generates a CRD
# full of fields that are accepted, validated, stored on the CR, and then silently
# ignored by the workload. That is exactly what 0.2.0 did: provider, policy and
# sources worked (they were set statically here) while domainFilters, txtOwnerId
# and credentialsSecretRef were inert, and external-dns crash-looped on a missing
# CF_API_TOKEN while the composition reported Ready.
#
# So the schema describes the upstream chart's own value names, one level down.
# The names are less pretty; they take effect.

external-dns:
  provider:
    name: cloudflare

  # Zones this instance may manage. Required — an empty list lets external-dns
  # modify every zone the credential can reach.
  domainFilters: []

  # sync = create AND delete records to match cluster state (records disappear
  # when their Service/Gateway does, including on teardown). upsert-only = never
  # delete. See the README: `sync` is what removes stale records, and also what
  # removed the demo's records when its cluster was rebuilt.
  #
  # Default is `sync` because this instance is the trial edge: when a trial child
  # is torn down its HTTPRoutes are deleted, and only `sync` deletes the matching
  # A/CNAME records — with upsert-only they leak, accumulating dead names against
  # the same zone every expired trial (the P0.4 DNS-leak this closes). `sync` is
  # made safe here by two render guards that always run: txtOwnerId is required,
  # so external-dns only ever deletes records whose ownership TXT it wrote (it
  # never touches a foreign record); and `sync` with empty domainFilters is
  # rejected outright, so it can never reach beyond the zones you name. Set
  # policy back to upsert-only only for a shared zone you deliberately never prune.
  policy: sync

  # gateway-httproute is required for the agentgateway edge.
  sources:
    - gateway-httproute
    - service

  # Written into ownership TXT records. MUST be unique per cluster sharing a zone,
  # or two clusters will overwrite each other's records. Required.
  txtOwnerId: ""

  # The provider credential, read from a Secret placed out-of-band. Required.
  # Cloudflare expects CF_API_TOKEN; other providers use different names.
  #
  #   env:
  #     - name: CF_API_TOKEN
  #       valueFrom:
  #         secretKeyRef:
  #           name: cloudflare-api-token
  #           key: api-token
  env: []
