# The platform's ClusterIssuers only. cert-manager itself is NOT installed here —
# it comes from the `cert-manager` blueprint, which this component depends on.
#
# Why the split: Helm applies a release's manifests in one pass, so cert-manager.io
# CRDs delivered by a subchart are not established when the parent's Issuer
# templates are applied. Bundling both failed on first install with
#   no matches for kind "ClusterIssuer" in version "cert-manager.io/v1"
#   ensure CRDs are installed first
# Ordering between two components is something the installer already models; a race
# inside one release is not.

# Internal self-signed CA chain. Always rendered: the platform needs a trust anchor
# before any public certificate exists.
internalCA:
  enabled: true
  name: krateo-selfsigned-ca

# Public ACME issuer. Off by default because it needs a real account email and a
# reachable Gateway to answer the HTTP-01 challenge.
acme:
  enabled: false
  email: ""
  server: https://acme-v02.api.letsencrypt.org/directory
  # Gateway that serves the HTTP-01 challenge (Gateway API, not Ingress). Must match
  # the agentgateway blueprint's gateway.name and the installer's
  # exposure.gatewayRef.name.
  gatewayRef:
    name: krateo-gateway
    namespace: krateo-system

# A SECOND ACME issuer that solves DNS-01. Off by default.
#
# Not a duplicate of `acme` above. HTTP-01 proves control of a hostname by serving a
# challenge on it, so it CANNOT issue wildcard certificates — Let's Encrypt requires
# DNS-01 for those. Anything needing *.<something> (per-tenant child hostnames, for
# example) needs this issuer.
#
# The cost is a credential: DNS-01 writes a TXT record, so cert-manager needs an API
# token for the zone. It is placed out-of-band and only referenced here — the same
# Secret external-dns already consumes can be reused.
acmeDns01:
  enabled: false
  name: krateo-acme-dns01
  email: ""
  server: https://acme-v02.api.letsencrypt.org/directory
  cloudflare:
    apiTokenSecretRef:
      # Must live in the namespace cert-manager runs in (its cluster resource namespace).
      name: cloudflare-api-token
      key: api-token
