# Krateo-facing surface. Everything not listed here stays at upstream defaults.
provider: cloudflare
# Zones this instance is allowed to manage. Leave empty to manage every zone the
# credential can reach —strongly discouraged on a shared account.
domainFilters: []
# sync = create AND delete records to match cluster state (records disappear when
# the Service/Gateway does). upsert-only = never delete. See the blueprint README:
# `sync` is what removes stale records, and also what removes them on teardown.
policy: upsert-only
# Reference to the provider API token. The Secret is NOT part of this blueprint —
# place it out-of-band and reference it here (same shape as KeycloakUser's secretRef).
credentialsSecretRef:
  name: ""
  key: "api-token"
# Sources to watch. gateway-httproute is required for the agentgateway edge.
sources:
  - gateway-httproute
  - service
# Owner TXT-record identifier. MUST be unique per cluster sharing a zone, or two
# clusters will fight over the same records.
txtOwnerId: ""

# ---------------------------------------------------------------------------
# Passthrough to the upstream chart. Helm requires subchart values to live under
# a key named after the subchart, and cannot compute them at render time — so the
# mapping is static here rather than templated.
# ---------------------------------------------------------------------------
external-dns:
  provider:
    name: cloudflare
  sources: [gateway-httproute, service]
  policy: upsert-only
