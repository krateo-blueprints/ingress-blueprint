name: lint

# Lints and renders every chart on pull requests, and validates that each chart's values.yaml
# satisfies its values.schema.json. Shape-agnostic: charts are discovered by locating each
# Chart.yaml (skipping vendored subcharts under charts/), so it works for any repo layout.
on:
  pull_request:
    paths:
      - "**"
  # The release refuses a commit with no successful lint run (krateo-blueprints/charts
  # PUBLISHING.md rule 10), and a release tags a commit on main, which a pull_request run
  # never covers.
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # krateo-blueprints/charts PUBLISHING.md rules 9 and 14: every reusable workflow and the shared chart-push action are
  # pinned by commit SHA with a version comment, and no chart is pushed bare. The shared check refuses anything else.
  pinned-uses:
    permissions:
      contents: read
    uses: krateo-blueprints/charts/.github/workflows/pinned-uses.yaml@f0bbd3da219685bafb130e77922c192558972a43 # 1.4.4

  lint-docs:
    uses: krateo-platformops/.github/.github/workflows/lint-docs.yaml@3ff640fd0dbef64c29b7a63a88b98da7f99e8052 # 1.0.1

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Stamp the CHART_VERSION placeholder for CI
        run: |
          find . -type f -name Chart.yaml -not -path '*/charts/*' -not -path './.git/*' \
            -exec sed -i "s/CHART_VERSION/0.0.0-ci/g" {} +

      - name: helm template + lint every chart (informational)
        run: |
          set -uo pipefail
          # Informational only: charts across repos legitimately require values or private
          # dependencies to render, so render/lint issues are surfaced as warnings, never failing
          # the build. The lint-docs job above is the authoritative gate.
          while IFS= read -r -d '' cf; do
            dir=$(dirname "$cf")
            echo "::group::${dir}"
            helm dependency update "$dir" 2>/dev/null || true
            helm template release "$dir" >/dev/null \
              || echo "::warning::helm template failed for ${dir} (may require values or private deps)"
            helm lint "$dir" || true
            echo "::endgroup::"
          done < <(find . -type f -name Chart.yaml -not -path '*/charts/*' -not -path './.git/*' -print0)
