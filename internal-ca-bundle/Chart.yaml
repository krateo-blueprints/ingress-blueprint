apiVersion: v2
name: internal-ca-bundle
description: >-
  Krateo blueprint distributing the platform's internal CA certificate (from
  cert-manager-issuers) to the namespaces whose workloads must trust it, as a
  trust-manager Bundle. Renders only the Bundle. Requires trust-manager to be
  installed first; it deliberately does NOT install it.
type: application
version: CHART_VERSION
appVersion: "v0.20.0"
home: https://krateo.io
keywords:
  - krateo
  - platformops
  - tls
  - trust-manager
# The repository that builds this chart. It renders only cert-manager/trust-manager custom
# resources and ships no upstream code, so the upstream project is not a source here (it is
# named in the description and docs). installer's pin-CI gate resolves a pin's CI through
# these repositories; an upstream repo here would make it assert upstream's CI instead.
sources:
  - https://github.com/krateo-blueprints/ingress-blueprint
