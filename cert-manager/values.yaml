# Installs upstream cert-manager and nothing else.
#
# This chart exists because a single chart CANNOT install cert-manager and also
# create ClusterIssuers/Certificates: Helm applies a release's manifests in one
# pass, so cert-manager.io CRDs delivered by the subchart are not established when
# the parent's Issuer templates are applied. The install fails with:
#
#   no matches for kind "ClusterIssuer" in version "cert-manager.io/v1"
#   ensure CRDs are installed first
#
# Splitting the operator from the Issuers makes the ordering a dependency between
# two components, which the installer already models, instead of a race inside one
# release.

cert-manager:
  # Install the CRDs with the operator. This is the whole point of this component:
  # the cert-manager-issuers blueprint depends on it precisely so that
  # cert-manager.io/v1 is served before any Issuer or Certificate is applied.
  crds:
    enabled: true

  # Gateway API support, OFF in upstream's defaults.
  #
  # Without it cert-manager never starts its gateway-shim, so a Gateway annotated
  # with cert-manager.io/cluster-issuer is simply ignored: no Certificate is created,
  # the HTTPS listeners stay ResolvedRefs=False for a Secret that never appears, and
  # nothing anywhere reports an error. The edge serves HTTP and silently never serves
  # HTTPS.
  #
  # This blueprint exists to back a Gateway API edge, so shipping a cert-manager that
  # cannot issue for Gateways would defeat its purpose. (ExperimentalGatewayAPISupport
  # already defaults to true; it is this switch that is off.)
  config:
    apiVersion: controller.config.cert-manager.io/v1alpha1
    kind: ControllerConfiguration
    gatewayAPI:
      enabled: true
