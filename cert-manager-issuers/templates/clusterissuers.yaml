{{/*
Platform ClusterIssuers. Adapted from
braghettos/krateo-acmp assembly/hardening/transit/cert-manager/clusterissuer.yaml,
with the <ACME_ACCOUNT_EMAIL> placeholder replaced by a schema-validated value.

Ordering note: the self-signed bootstrap issues the root CA Certificate, which in
turn backs the CA ClusterIssuer. cert-manager resolves that chain itself, so no
explicit ordering is needed here.
*/}}
{{- if .Values.internalCA.enabled }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: krateo-selfsigned-bootstrap
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: krateo-root-ca
  {{/*
    The CA Certificate must live in cert-manager's "cluster resource namespace",
    which defaults to the namespace cert-manager itself runs in — NOT a namespace
    literally called cert-manager. When cert-manager is a Krateo composition it
    renders into the composition's namespace, so hardcoding `cert-manager` both
    fails RBAC generation ("namespaces \"cert-manager\" not found") and would put
    the CA secret somewhere the ca ClusterIssuer cannot read it.
  */}}
  namespace: {{ .Release.Namespace }}
spec:
  isCA: true
  commonName: krateo-root-ca
  secretName: krateo-root-ca-key-pair
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: krateo-selfsigned-bootstrap
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.internalCA.name }}
spec:
  ca:
    secretName: krateo-root-ca-key-pair
{{- end }}

{{- if .Values.acme.enabled }}
{{- if not .Values.acme.email }}
{{- fail "cert-manager-issuers: acme.enabled is true but acme.email is empty. ACME registration requires an account email." }}
{{- end }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: krateo-acme
spec:
  acme:
    server: {{ .Values.acme.server | quote }}
    email: {{ .Values.acme.email | quote }}
    privateKeySecretRef:
      name: krateo-acme-account-key
    solvers:
      - http01:
          {{/*
            HTTP-01 is solved through the Gateway API edge, not an Ingress. This
            is why no DNS provider credential is needed here — the challenge is
            served over HTTP by the same Gateway that terminates TLS.
          */}}
          gatewayHTTPRoute:
            parentRefs:
              - name: {{ .Values.acme.gatewayRef.name }}
                namespace: {{ .Values.acme.gatewayRef.namespace }}
                kind: Gateway
{{- end }}

{{- if .Values.acmeDns01.enabled }}
{{- if not .Values.acmeDns01.email }}
{{- fail "cert-manager-issuers: acmeDns01.enabled is true but acmeDns01.email is empty. ACME registration requires an account email." }}
{{- end }}
{{- if not .Values.acmeDns01.cloudflare.apiTokenSecretRef.name }}
{{- fail "cert-manager-issuers: acmeDns01 requires cloudflare.apiTokenSecretRef.name — the API token Secret is placed out-of-band and only referenced here." }}
{{- end }}
---
{{/*
  A SECOND ACME issuer, solving DNS-01 instead of HTTP-01.

  This is not a duplicate of krateo-acme. HTTP-01 proves control of one hostname by
  serving a challenge on it, so it CANNOT issue a wildcard certificate — Let's Encrypt
  requires DNS-01 for those. Any consumer needing *.<something> (per-tenant child
  hostnames, for instance) needs this issuer, not the HTTP-01 one.

  The trade-off is a credential: DNS-01 writes a TXT record, so cert-manager needs an
  API token for the zone. The token is placed out-of-band and referenced here — it is
  never part of this blueprint's values, and the same Secret external-dns already uses
  can be reused.
*/}}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.acmeDns01.name }}
spec:
  acme:
    server: {{ .Values.acmeDns01.server | quote }}
    email: {{ .Values.acmeDns01.email | quote }}
    privateKeySecretRef:
      name: {{ .Values.acmeDns01.name }}-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: {{ .Values.acmeDns01.cloudflare.apiTokenSecretRef.name }}
              key: {{ .Values.acmeDns01.cloudflare.apiTokenSecretRef.key }}
{{- end }}
