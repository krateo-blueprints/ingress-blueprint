{{/*
  T2 — per-tenant token credits, enforced by agentgateway policy alone (no balance service).

  One AgentgatewayPolicy on the LLM route with a per-tenant LOCAL token bucket: `key` is CEL
  over the authenticated client key's metadata (credits.tenantExpression, default
  apiKey.tenant), so every tenant gets its own bucket. The bucket's plan is chosen with
  `conditional`: one branch per plan matched on credits.planExpression (default apiKey.plan,
  the `plan` the provisioning blueprint writes into the key's metadata), then the
  credits.defaultPlan branch as the unconditioned fallback — a key with no or an unknown plan
  is never unmetered.

  How a credit maps onto a bucket (verified live on agentgateway v1.6.0):
  - the bucket starts FULL at `burst` tokens and refills `tokensPerHour` every hour;
  - a ONE-OFF credit (trial) is burst = the credit, tokensPerHour ≈ 0. It holds regardless of
    trial length because the key is revoked at teardown;
  - a RECURRING credit (monthly) is tokensPerHour = credit / hours-per-period, with a
    bounded burst.
  - Exhaustion returns 429 ("rate limit exceeded"). Tokens are counted after the request
    completes, so the call that crosses zero may overshoot by its own size; the NEXT one is
    refused.

  Known limits (documented in docs/credits.md): counts raw tokens, not USD (local limits take
  no cost CEL), so the amounts are converted at a measured effective $/token; buckets live in
  the proxy's memory, so a gateway restart refills them and each replica keeps its own.
*/}}
{{- if .Values.credits.enabled }}
{{- if not .Values.llm.enabled }}
{{ fail "credits.enabled requires llm.enabled — credits meter the LLM route" }}
{{- end }}
{{- $plans := .Values.credits.plans | default dict }}
{{- if not $plans }}
{{ fail "credits.enabled requires credits.plans (set the amounts at deploy time)" }}
{{- end }}
{{- $default := .Values.credits.defaultPlan }}
{{- if not (hasKey $plans $default) }}
{{ fail (printf "credits.defaultPlan %q must name one of credits.plans" $default) }}
{{- end }}
{{- $key := .Values.credits.tenantExpression }}
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: llm-credits
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: {{ .Values.gateway.name }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: llm
  traffic:
    rateLimit:
      conditional:
        {{- range $name := keys $plans | sortAlpha }}
        {{- if ne $name $default }}
        {{- $p := index $plans $name }}
        - condition: {{ printf "%s == %q" $.Values.credits.planExpression $name | quote }}
          policy:
            local:
              - key: {{ $key | quote }}
                tokens: {{ required (printf "credits.plans.%s.tokensPerHour is required" $name) $p.tokensPerHour | int64 }}
                unit: Hours
                burst: {{ required (printf "credits.plans.%s.burst is required" $name) $p.burst | int64 }}
        {{- end }}
        {{- end }}
        {{- $d := index $plans $default }}
        - policy:
            local:
              - key: {{ $key | quote }}
                tokens: {{ required (printf "credits.plans.%s.tokensPerHour is required" $default) $d.tokensPerHour | int64 }}
                unit: Hours
                burst: {{ required (printf "credits.plans.%s.burst is required" $default) $d.burst | int64 }}
{{- end }}
