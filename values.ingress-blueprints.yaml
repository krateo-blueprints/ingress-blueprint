# Installer catalog registration — ingress / edge tier
#
# Registers the edge-support blueprints as installer components, following the same
# additive `.spec.components` pattern as assembly/installer-catalog's D25 auth
# blueprints. Merge this into the installer values; `inst.componentsYaml` appends
# rather than replaces, so the base component set is untouched.
#
# Gated behind `features.ingress` so a cluster that fronts Krateo some other way
# (an existing ingress controller, a cloud LB, a service mesh) is unaffected.
#
# ORDER (dep-chained below): gateway-api-crds -> agentgateway -> cert-manager-issuers /
# external-dns. The CRDs must be served before the Gateway; the Gateway must exist before
# the ACME gatewayRef and the installer's per-component HTTPRoutes (exposure.type=Gateway)
# attach to it. `gateway.name` here must equal exposure.gatewayRef.name and acme.gatewayRef.name.
#
# PREREQUISITES
#   1. The blueprints published to an OCI registry the installer can pull
#      (`repo:` below, or the default `ociRepo` if published alongside the platform).
#   2. The Cloudflare API token Secret placed out-of-band, in the namespace the
#      external-dns composition renders into. The blueprint takes a reference only —
#      no credential is ever part of a blueprint's values or its Composition CR.
#
# NOT INCLUDED, deliberately:
#   - kyverno tenant onboarding — owned by the C2 workstream in krateo-saas.

features:
  # New gate. Off by default: adding a component must not change existing installs.
  ingress: false

components:
  # 1. Gateway API CRDs first — shared infra the Gateway, HTTPRoutes and ACME gatewayRef need.
  - name: gateway-api-crds
    kind: GatewayApiCrds
    chart: gateway-api-crds
    version: "0.1.0"
    tier: platform
    feature: ingress

  # 2. The Gateway (agentgateway controller + GatewayClass + Gateway). Needs the CRDs served.
  - name: agentgateway
    kind: Agentgateway
    chart: agentgateway
    version: "0.1.0"
    tier: platform
    feature: ingress
    deps:
      - gateway-api-crds

  # 3. cert-manager: its ACME issuer solves HTTP-01 through the Gateway, so the Gateway first.
  - name: cert-manager-issuers
    kind: CertManagerIssuers
    chart: cert-manager-issuers
    version: "0.1.0"
    tier: platform
    feature: ingress
    deps:
      - agentgateway

  - name: external-dns
    kind: ExternalDns
    chart: external-dns
    version: "0.1.0"
    tier: platform
    feature: ingress
    deps:
      # Ordered after the Gateway (it publishes records for the Gateway's HTTPRoutes) and
      # after cert-manager, so certs are issuing before the hostnames become resolvable.
      - agentgateway
      - cert-manager-issuers

componentValues:
  agentgateway:
    # gateway.name MUST match exposure.gatewayRef.name (installer) and acme.gatewayRef.name below.
    gatewayClassName: agentgateway
    controllerName: agentgateway.dev/agentgateway
    gateway:
      name: krateo-gateway
      listeners:
        - name: http
          protocol: HTTP
          port: 80
          allowedRoutes:
            namespaces:
              from: All

  cert-manager-issuers:
    internalCA:
      enabled: true
    acme:
      # Enable once public DNS resolves to the Gateway — HTTP-01 cannot succeed
      # before the hostname points at the edge that serves the challenge.
      enabled: false
      email: ""            # REQUIRED when acme.enabled is true
      gatewayRef:
        name: krateo-gateway
        namespace: krateo-system

  # Nested under `external-dns` because Helm cannot compute subchart values at render
  # time — a curated top-level surface is accepted by the CRD and then never reaches the
  # workload. That was the 0.2.0 bug; see the repo README.
  external-dns:
    external-dns:
      provider:
        name: cloudflare
      policy: upsert-only    # `sync` also DELETES records when their source object goes away
      domainFilters:
        - krateo.dev
      sources:
        - gateway-httproute  # required for the agentgateway edge
        - service
      txtOwnerId: ""         # REQUIRED, and must be unique per cluster sharing the zone
      # The Secret is placed out-of-band; only the reference lives here.
      env:
        - name: CF_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: cloudflare-api-token
              key: api-token
